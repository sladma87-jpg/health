<style>
:root{
  --bg:#f5f3ee;--card:#ffffff;--ink:#1d2421;--sub:#6b736f;--line:#e6e2d9;
  --acc:#1f7a55;--acc2:#e9f4ee;--warn:#d9822b;--bad:#c94a3c;--carb:#e2a93b;--prot:#3d7fd1;--fat:#d0627a;--water:#3aa6c9;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121614;--card:#1c2220;--ink:#e9eeeb;--sub:#97a19c;--line:#2c3431;--acc:#3fb47f;--acc2:#1d3328;--shadow:none;}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;font-size:15px}
body{padding-bottom:110px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{resize:vertical;min-height:60px}
.wrap{max-width:760px;margin:0 auto;padding:12px 14px}
header.top{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 4px;max-width:760px;margin:0 auto}
header.top h1{font-size:20px;margin:0;letter-spacing:-.3px}
.datenav{display:flex;align-items:center;gap:4px;font-weight:600}
.datenav button{width:34px;height:34px;border-radius:50%;font-size:18px}
.datenav button:active{background:var(--line)}
.card{background:var(--card);border-radius:18px;padding:16px;margin:10px 0;box-shadow:var(--shadow)}
.card h2{font-size:15px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
.card h2 small{font-weight:400;color:var(--sub);font-size:13px}
.muted{color:var(--sub);font-size:13px}
.row{display:flex;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{background:var(--acc);color:#fff;border-radius:12px;padding:12px 16px;font-weight:600;text-align:center}
.btn.ghost{background:var(--acc2);color:var(--acc)}
.btn.line{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.small{padding:7px 11px;font-size:13px;border-radius:10px}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--line)}
.btn:disabled{opacity:.5}
.btn:active{transform:scale(.98)}
.ringbox{display:flex;align-items:center;gap:18px}
.ring{position:relative;width:150px;height:150px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .big{font-size:28px;font-weight:800;letter-spacing:-1px}
.stats{flex:1;display:flex;flex-direction:column;gap:9px}
.bar{height:8px;border-radius:5px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px}
.lbl{display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.quick button{background:var(--card);border-radius:16px;padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12.5px;box-shadow:var(--shadow)}
.quick button span{font-size:24px}
.water{display:flex;flex-wrap:wrap;gap:6px}
.cup{width:34px;height:40px;border-radius:6px 6px 10px 10px;border:2px solid var(--water);position:relative;overflow:hidden}
.cup.on::after{content:"";position:absolute;left:0;right:0;bottom:0;height:75%;background:var(--water);opacity:.8}
.meal{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.meal:first-of-type{border-top:0}
.meal img,.meal .ph{width:58px;height:58px;border-radius:12px;object-fit:cover;flex:none;background:var(--acc2);display:flex;align-items:center;justify-content:center;font-size:26px}
.meal .t{flex:1;min-width:0}
.meal .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:20px;background:var(--acc2);color:var(--acc);font-weight:600}
.tag.w{background:#fbeedf;color:var(--warn)}
.tag.b{background:#f9e3e0;color:var(--bad)}
.sup{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.sup:first-of-type{border-top:0}
.chk{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff}
.chk.on{background:var(--acc);border-color:var(--acc)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 0 calc(8px + env(safe-area-inset-bottom));z-index:20}
nav.tabs button{display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--sub);gap:2px;min-width:56px}
nav.tabs button span{font-size:21px;filter:grayscale(1);opacity:.6}
nav.tabs button.on{color:var(--acc);font-weight:700}
nav.tabs button.on span{filter:none;opacity:1}
nav.tabs .cam{background:var(--acc);color:#fff;width:58px;height:58px;border-radius:50%;margin-top:-26px;justify-content:center;box-shadow:0 4px 14px rgba(31,122,85,.35)}
nav.tabs .cam span{filter:none;opacity:1;font-size:26px}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 12px;font-size:18px;display:flex;justify-content:space-between;align-items:center}
.sheet h3 button{font-size:22px;color:var(--sub)}
.field{margin:10px 0}
.field label{display:block;font-size:13px;color:var(--sub);margin-bottom:5px}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:9px 4px;border-radius:9px;font-size:13.5px}
.seg button.on{background:var(--card);font-weight:700;color:var(--acc);box-shadow:var(--shadow)}
.fi{border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:8px 0}
.fi .top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.fi .top input{font-weight:700;padding:6px 8px}
.fi .mac{font-size:12.5px;color:var(--sub);margin-top:5px}
.mult{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
.mult button{border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:12.5px}
.mult button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.preview{width:100%;max-height:300px;object-fit:cover;border-radius:16px;display:block}
.spin{width:22px;height:22px;border:3px solid var(--acc2);border-top-color:var(--acc);border-radius:50%;animation:sp 1s linear infinite;display:inline-block;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.camview{position:fixed;inset:0;background:#000;z-index:60;display:flex;flex-direction:column}
.camview video{flex:1;width:100%;object-fit:cover;min-height:0}
.camview .bar2{display:flex;justify-content:space-around;align-items:center;padding:18px 10px calc(24px + env(safe-area-inset-bottom));background:#000}
.shutter{width:74px;height:74px;border-radius:50%;background:#fff;border:5px solid #888}
.camview .bar2 button.s{color:#fff;font-size:15px;width:80px}
.camguide{position:absolute;top:20px;left:0;right:0;text-align:center;color:#fff;font-size:14px;text-shadow:0 1px 3px #000}
.list-item{display:flex;justify-content:space-between;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line)}
.list-item:active{background:var(--bg)}
canvas{width:100%;display:block}
.coach{white-space:pre-wrap;line-height:1.6;font-size:14px}
.note{background:var(--acc2);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.55;margin:8px 0}
.note.w{background:#fbeedf;color:#7a4a12}

.toast.on{opacity:.95}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.kv div{background:var(--bg);border-radius:12px;padding:10px 4px}
.kv b{display:block;font-size:18px}
.kv span{font-size:11.5px;color:var(--sub)}

.hidden{display:none!important}
.stp{width:34px;height:34px;border-radius:10px;border:1px solid var(--line)!important;font-size:18px;line-height:1;background:var(--card)}

const ACT=[{v:1.2,t:'주로 앉아서 지냄',d:'사무직·운전'},{v:1.3,t:'서 있거나 자주 걷는 편',d:'매장·외근'},{v:1.45,t:'몸을 많이 쓰는 일',d:'현장·육체노동'}];
function migrateAct(){if(S.profile&&!ACT.some(a=>a.v==S.profile.act)){S.profile.act=1.2;S.exNotice=true;save()}}
function curWeight(){const w=S.weights.slice().sort((a,b)=>a.d<b.d?-1:1);return w.length?w[w.length-1].kg:(S.profile?S.profile.weight:70)}
function calc(dd){
  const p=S.profile;if(!p)return null;
  const w=curWeight(),h=+p.height,age=new Date().getFullYear()-(+p.birth);
  const bmr=10*w+6.25*h-5*age+(p.sex==='m'?5:-161);
  const tdee=bmr*(+p.act||1.2)*(+p.adj||1);
  let target=tdee;
  const pace=+p.pace||0.5;
  if(p.goal==='lose')target=tdee-pace*7700/7;
  if(p.goal==='gain')target=tdee+300;
  const floor=p.sex==='m'?1500:1200;
  let floored=false; if(target<floor){target=floor;floored=true}
  target=Math.round(target/10)*10;
  const protK=p.goal==='lose'?1.6:p.goal==='gain'?1.8:1.2;
  const refW=Math.min(w,(h-100)*1.15+15);
  let prot=Math.round(Math.min(refW*protK,w*2.2));
  const protPlus=dd&&(dd.ex||[]).some(e=>e.type==='str')?Math.round(w*0.2):0;prot+=protPlus;
  const fat=Math.round(target*0.27/9);
  const carb=Math.max(50,Math.round((target-prot*4-fat*9)/4));
  const bmi=w/((h/100)**2);
  return {adj:+p.adj||1,protPlus,w,h,age,bmr:Math.round(bmr),tdee:Math.round(tdee),target,prot,fat,carb,bmi,floored,
    water:Math.round(w*33/250)*250,sodium:2300,sugar:Math.round(target*0.2/4),asugar:Math.round(target*0.1/4),fiber:p.sex==='m'?30:25,
    steps:age<60?8000:7000,mealProt:Math.max(20,Math.round(refW*0.4)),
    pct:{c:Math.round((target-prot*4-fat*9)/target*100),p:Math.round(prot*4/target*100),f:Math.round(fat*9/target*100)}}
}
function bmiTxt(b){return b<18.5?['저체중','w']:b<23?['정상','']:b<25?['비만 전단계','w']:b<30?['1단계 비만','b']:b<35?['2단계 비만','b']:['3단계 비만','b']}
function sumItems(items){const t={kcal:0,carb:0,prot:0,fat:0,sugar:0,asugar:0,na:0,fiber:0};for(const it of items||[]){for(const k in t)t[k]+=(+it[k]||0)}return t}
function stepKcal(d){const st=+d?.steps||0;return st>5000?Math.round((st-5000)*0.0004*curWeight()):0}
function dayTotals(d){const t=sumItems((d?.meals||[]).flatMap(m=>m.items));t.exOnly=(d?.ex||[]).reduce((a,e)=>a+(+e.kcal||0),0);t.stepK=stepKcal(d);t.ex=t.exOnly+t.stepK;return t}
// 칼로리 밀도(kcal/g): 시중 앱의 신호등 방식 — 초록 <1, 노랑 1~2.4, 주황 ≥2.4
function densOf(it){if(!(+it.grams>0))return null;const v=it.kcal/it.grams;return v<1?'g':v<2.4?'y':'o'}
const DENS={g:['초록','#3aa36a','배부르고 가벼운 음식'],y:['노랑','#e2a93b','적당히'],o:['주황','#e0703a','조금만']};
function densMix(items){const m={g:0,y:0,o:0,n:0};for(const it of items){const d=densOf(it);if(d)m[d]+=+it.kcal||0;else m.n+=+it.kcal||0}return m}
// 하루 식단 점수 (100점)
function dayScore(d,c){const t=dayTotals(d);if(!(d?.meals||[]).length||t.kcal<c.target*0.4)return null;
  const budget=c.target+t.ex;const dev=Math.abs(t.kcal-budget)/budget;
  const sk=dev<=0.1?25:Math.max(0,25*(1-(dev-0.1)/0.3));
  const sp=20*Math.min(1,t.prot/c.prot);
  const sn=t.na<=c.sodium?15:Math.max(0,15*(1-(t.na-c.sodium)/c.sodium));
  const ss=t.asugar<=c.asugar?15:Math.max(0,15*(1-(t.asugar-c.asugar)/c.asugar));
  const sf=10*Math.min(1,t.fiber/c.fiber);
  const m=densMix(d.meals.flatMap(x=>x.items));const tot=m.g+m.y+m.o;const os=tot?m.o/tot:0.4;
  const sd=os<=0.35?15:Math.max(0,15*(1-(os-0.35)/0.4));
  const parts={kcal:sk,prot:sp,na:sn,sugar:ss,fiber:sf,dens:sd};
  return{score:Math.round(sk+sp+sn+ss+sf+sd),parts}}
function scoreGrade(v){return v>=85?['아주 좋아요','var(--acc)']:v>=70?['좋아요','var(--acc)']:v>=55?['보통','var(--warn)']:['아쉬워요','var(--bad)']}

    if(ss.jetlag!=null)h+=`<div class="list-item"><span>주말 수면 시차 <span class="muted" style="font-size:12px">주말에 늦게 자고 늦게 일어난 정도</span></span><span><b>${Math.abs(Math.round(ss.jetlag))}분</b> <span class="tag ${Math.abs(ss.jetlag)<=60?'':'w'}">${Math.abs(ss.jetlag)<=60?'괜찮음':'큼'}</span></span></div>`}
  for(const f of ss.factors||[])h+=`<div class="note ${f.diff<0?'w':''}" style="margin-top:8px">${f.diff<0?'⚠️':'✅'} <b>${f.name}</b> 다음 날 아침 개운함이 평균 ${Math.abs(r1(f.diff))}점 ${f.diff<0?'낮았어요':'높았어요'} (${f.ny}회 기준)</div>`;
  h+=`<div class="muted" style="font-size:12px;line-height:1.55;margin-top:10px">성인 권장 수면은 7~9시간이에요. 큰 연구에서 수면 <b>시간</b>보다 매일 같은 시각에 자고 일어나는 <b>규칙성</b>이 건강과 더 강하게 연결됐어요. 충분히 자도 계속 피곤하거나 코골이·숨 멈춤이 있으면 수면 검사를 받아 보세요.</div>`;
  return h+`</div>`}

function readProfile(root){const g=id=>root.querySelector(id);const segv=id=>g(id+' .on')?.dataset.v;

function showTargets(first){const c=calc();

  <div class="kv" style="margin-top:8px"><div><b>${c.mealProt}g</b><span>끼니당 단백질</span></div><div><b>${c.asugar}g</b><span>첨가당 상한</span></div><div><b>${c.steps.toLocaleString()}</b><span>하루 걸음</span></div></div>

  ${c.floored?`<div class="note w">건강을 위해 하루 목표를 너무 낮게 잡지 않도록 최소치(${S.profile.sex==='m'?1500:1200}kcal)로 맞췄어요.</div>`:''}
  ${goalEta(c)}
  <div class="muted" style="line-height:1.6;margin-top:8px">계산식: Mifflin-St Jeor 기초대사량 × 활동계수${c.adj!==1?` × 맞춤 보정 ${c.adj}`:''}${S.profile.goal==='lose'?' − 감량분(1kg≈7,700kcal)':S.profile.goal==='gain'?' + 300kcal':''}, 운동은 기록한 만큼 더해요. 단백질은 목표에 따라 체중 1kg당 ${S.profile.goal==='lose'?1.6:S.profile.goal==='gain'?1.8:1.2}g(국제스포츠영양학회 권고 범위), 끼니당 0.4g/kg씩 나눠 먹기를 권해요. 걸음 목표는 대규모 연구에서 사망 위험 감소 효과가 더 늘지 않는 지점 기준이에요.</div>
  ${first?`<div class="note" style="margin-top:12px">📷 <b>사진 칼로리 계산</b>을 쓰려면 <b>내 정보 → AI 설정</b>에서 무료 Gemini 키를 한 번 넣어 주세요. 키가 없어도 음식 검색으로 기록할 수 있어요.</div>`:''}
  <button class="btn" style="width:100%;margin-top:12px" onclick="closeSheet()">확인</button>`)}
function goalEta(c){const p=S.profile;if(!p.targetW||p.goal==='keep')return'';const diff=c.w-p.targetW;const six=r1(c.w*0.1);
  if(p.goal==='lose'&&diff>0){const wk=diff/(+p.pace||0.5);const d=new Date();d.setDate(d.getDate()+Math.round(wk*7));return `<div class="note">목표 ${p.targetW}kg까지 ${r1(diff)}kg — 이 속도면 약 <b>${Math.ceil(wk)}주 후 (${d.getFullYear()}.${d.getMonth()+1}월경)</b> 도달 예상이에요. 대한비만학회는 <b>6개월에 현재 체중의 10%(${six}kg)</b> 정도 감량을 권해요. 체중이 줄면 소모량도 줄어서 후반엔 속도가 느려지는 게 정상이에요.</div>`}
  if(p.goal==='gain'&&diff<0)return `<div class="note">목표 ${p.targetW}kg까지 ${r1(-diff)}kg — 주 0.25~0.5kg 증가가 근육 위주 증량에 좋아요.</div>`;
  return ''}

async function askAI0(prompt,imageUrl,json=true){
  const s=S.settings;
  const img=imageUrl?{mime:'image/jpeg',b64:imageUrl.split(',')[1]}:null;
  let lastErr;
  if(s.provider==='claude'){
    const models=[s.claudeModel,...CLAUDE_FALLBACK.filter(m=>m!==s.claudeModel)].filter(Boolean);
    for(const m of models){
      const content=[];if(img)content.push({type:'image',source:{type:'base64',media_type:img.mime,data:img.b64}});content.push({type:'text',text:prompt});
      const r=await fetchT('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':s.claudeKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
        body:JSON.stringify({model:m,max_tokens:2000,messages:[{role:'user',content}]})});
      const j=await r.json().catch(()=>({}));
      if(r.ok){if(m!==s.claudeModel){s.claudeModel=m;save()}const txt=(j.content||[]).map(c=>c.text||'').join('');return json?parseJSON(txt):txt}
      lastErr=(j.error&&j.error.message)||('HTTP '+r.status);if(r.status!==404&&!/model/i.test(lastErr))break;
    }
  }else{

    const logs=[];const tStart=Date.now();
    for(const m of models){if(Date.now()-tStart>75000)break;
      const parts=[];if(img)parts.push({inline_data:{mime_type:img.mime,data:img.b64}});parts.push({text:prompt});
      const think=/^gemini-3|flash-latest/.test(m);
      const mk=th=>({contents:[{role:'user',parts}],generationConfig:{temperature:0.2,...(th?{thinkingConfig:{thinkingLevel:/lite/.test(m)?'low':'minimal'}}:{}),...(json?{responseMimeType:'application/json'}:{})}});
      const call=th=>fetchT('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(m)+':generateContent',{method:'POST',headers:{'content-type':'application/json','x-goog-api-key':s.geminiKey},body:JSON.stringify(mk(th))},img?30000:20000);
      const t1=Date.now();let r,j;
      try{r=await call(think);j=await r.json().catch(()=>({}));
      if(!r.ok&&think&&r.status===400&&/think/i.test(j.error?.message||'')){r=await call(false);j=await r.json().catch(()=>({}))}}
      catch(e){logs.push(m+': '+(e.message==='TIMEOUT'?'시간초과':'연결실패('+e.message+')'));aiLog=logs.join(' / ');lastErr=e.message==='TIMEOUT'?'TIMEOUT':e.message;continue}
      logs.push(m+': '+r.status+' '+((Date.now()-t1)/1000).toFixed(1)+'초'+(j.error?.message?' '+j.error.message.slice(0,100):''));aiLog=logs.join(' / ');
      if(r.ok){if(m!==s.geminiModel||!s.geminiOK){s.geminiModel=m;s.geminiOK=true;save()}const txt=(j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('');
        if(!txt)throw new Error('AI가 답을 주지 않았어요 ('+(j.candidates?.[0]?.finishReason||j.promptFeedback?.blockReason||'빈 응답')+')');return json?parseJSON(txt):txt}
      lastErr=(j.error&&j.error.message)||('HTTP '+r.status);if(![404,429,500,503].includes(r.status)&&!/not found|not supported|model|overloaded|unavailable/i.test(lastErr))break;
    }
  }
  if(lastErr==='TIMEOUT')throw new Error('TIMEOUT');
  throw new Error(friendlyErr(lastErr));
}
function friendlyErr(e){e=String(e||'');if(/api key|API_KEY|invalid x-api-key|authentication|PERMISSION_DENIED|401|403/i.test(e))return 'API 키가 올바르지 않아요. 내 정보 → AI 설정에서 확인해 주세요.';
  if(/quota|rate|429|RESOURCE_EXHAUSTED|overloaded/i.test(e))return '요청이 많아 잠시 막혔어요. 1분쯤 뒤에 다시 해 주세요.';
  if(/credit|billing|balance/i.test(e))return 'API 크레딧/결제 설정을 확인해 주세요. ('+e.slice(0,80)+')';
  if(/Failed to fetch|NetworkError|network/i.test(e))return '인터넷 연결을 확인해 주세요.';return e.slice(0,160)}
function parseJSON(t){t=String(t).trim().replace(/^```(?:json)?/i,'').replace(/```$/,'').trim();try{return JSON.parse(t)}catch(e){const a=t.indexOf('{'),b=t.lastIndexOf('}');if(a>=0&&b>a)return JSON.parse(t.slice(a,b+1));throw new Error('AI 응답을 읽지 못했어요. 다시 시도해 주세요.')}}
function profileLine(){const c=calc(),p=S.profile;return `${p.sex==='m'?'남성':'여성'} ${c.age}세, ${p.height}cm, ${r1(c.w)}kg, 목표: ${{lose:'감량',keep:'유지',gain:'증량'}[p.goal]}, 하루 목표 ${c.target}kcal(탄${c.carb}/단${c.prot}/지${c.fat}g)`}
const FOOD_PROMPT=`당신은 한국 음식에 정통한 임상영양사입니다. 사진 속 음식을 보고 실제로 먹는 양을 추정해 영양성분을 계산하세요.
규칙:
- 사진에 보이는 음식을 각각 따로 항목으로 (밥, 국, 반찬, 음료 등). 한국 음식은 정확한 한국어 이름 사용.
- 그릇 크기, 수저, 손 등을 기준으로 실제 양(g)을 추정. 1인분 기준이 아니라 사진에 보이는 양 기준.
- 조리법(튀김, 볶음, 소스, 기름)과 숨은 칼로리(드레싱, 설탕, 마요네즈)를 반영.
- 한국 식품의약품안전처 식품영양성분 DB 수준의 값을 기준으로 함.
- 양 추정 기준: 밥공기 지름 약 11cm(가득 210g, 보통 담으면 180g), 국그릇 지름 약 15cm(국 300~400g), 반찬 종지 30~70g, 일반 접시 지름 20~26cm, 숟가락 길이 약 19cm, 성인 손바닥 폭 약 8cm.
- 먼저 그릇·수저 크기로 축척을 잡고, 각 음식이 그릇을 얼마나 채웠는지(높이 포함) 보고 g을 정한 뒤 g × 100g당 영양값으로 계산.
- 볶음·튀김·전은 흡수된 기름(1큰술≈110kcal)을, 무침·샐러드는 드레싱·참기름을 꼭 포함. 국물 요리 나트륨은 국물을 다 마신다고 가정.
- 음료·소스·같이 찍힌 디저트도 빠뜨리지 말 것. 반쯤 먹은 음식은 남은 양만.
- sugar는 총당류, added_sugar는 설탕·물엿·시럽·꿀 등 조리·가공 중 넣은 첨가당만(과일·우유·채소의 자연당 제외).
- 사진이 영양제·건강기능식품·약의 포장이나 성분표(영양·기능정보)라면 다른 것은 하지 말고 {"kind":"supplement","foods":[]}만 출력.
- 음식이 아니거나 판별 불가하면 foods를 빈 배열로 하고 comment에 이유.
아래 JSON만 출력:
{"foods":[{"name":"음식명","amount":"1공기 등 눈으로 본 양","grams":0,"kcal":0,"carb":0,"protein":0,"fat":0,"sugar":0,"added_sugar":0,"sodium":0,"fiber":0,"confidence":"높음|보통|낮음"}],"comment":"이 식사에 대한 한 줄 영양 코멘트(한국어, 40자 이내)"}`;
function aiToItems(j){return (j.foods||[]).filter(f=>f&&f.name).map(f=>({name:String(f.name),amount:String(f.amount||''),grams:+f.grams||0,kcal:+f.kcal||0,carb:+f.carb||0,prot:+(f.protein??f.prot)||0,fat:+f.fat||0,sugar:+f.sugar||0,asugar:+(f.added_sugar??f.asugar)||0,na:+(f.sodium??f.na)||0,fiber:+f.fiber||0,conf:f.confidence||'',mult:1}))}

      <details id="setbox" ${st.sets.length?'open':''}><summary class="muted" style="padding:4px 0">세트 기록 (선택) — 무게가 느는 걸 볼 수 있어요</summary><datalist id="liftlist">${[...new Set([...(S.lifts||[]),...LIFTS])].map(n=>`<option value="${esc(n)}">`).join('')}</datalist><div id="sets"></div><button class="btn line small" id="addset">+ 종목 추가</button></details>`;

      <div class="field"><label>강도</label><div class="seg" id="exi">${Object.entries(CINT).map(([k,v])=>`<button data-v="${k}" class="${st.int===k?'on':''}">${v.t}</button>`).join('')}</div></div>

  function drawSets(){const box=$('#sets');if(!box)return;box.innerHTML=st.sets.map((s,i)=>`<div class="row" style="margin:6px 0;gap:5px"><input style="flex:2.2;min-width:0" list="liftlist" data-k="n" data-i="${i}" value="${esc(s.n)}" placeholder="종목"><input style="flex:1;min-width:0" type="number" inputmode="decimal" data-k="kg" data-i="${i}" value="${s.kg}" placeholder="kg"><input style="flex:1;min-width:0" type="number" inputmode="numeric" data-k="reps" data-i="${i}" value="${s.reps}" placeholder="회"><input style="flex:.9;min-width:0" type="number" inputmode="numeric" data-k="sets" data-i="${i}" value="${s.sets}" placeholder="세트"><button class="muted" data-del="${i}">✕</button></div>`).join('')+(st.sets.length?'<div class="muted" style="font-size:12px">종목 · 무게(kg) · 횟수 · 세트 수</div>':'');

const MREF={

  const r=kdv(k.r,c),ul=kdv(k.ul,c);
  if(ul&&v>ul)return{s:'over',t:'상한 초과',cls:'b'};

function trendSeries(){const w=S.weights.slice().sort((a,b)=>a.d<b.d?-1:1);if(!w.length)return[];

  while(d<=end){const k=dkey(d);if(map[k]!=null)tr=tr+0.1*(map[k]-tr);out.push({d:k,t:tr,raw:map[k]});d.setDate(d.getDate()+1)}return out}

function adaptive(){const p=S.profile;const c0=calc();const from=new Date();from.setDate(from.getDate()-27);const fk=dkey(from),tk=todayKey();

  const tr=trendSeries().filter(x=>x.d>=fk&&x.d<tk);const ws=S.weights.filter(w=>w.d>=fk&&w.d<tk);

  if(logged.length<10||ws.length<3||span<13)return{ok:false,need};
  const slope=(tr[tr.length-1].t-tr[0].t)/span;
  const intake=logged.reduce((a,t)=>a+t.kcal,0)/logged.length,ex=logged.reduce((a,t)=>a+t.ex,0)/logged.length;

function adaptCard(){const a=adaptive(),p=S.profile;const auto=p.autoAdj!==false;
  let h=`<div class="card"><h2>🧠 내 몸 맞춤 보정 <small>${(+p.adj||1)!==1?`<span class="tag">적용 중 ×${p.adj}</span>`:''}</small></h2>`;
  if(!a.ok){const n=a.need;h+=`<div class="muted" style="line-height:1.6">공식으로 구한 소모 칼로리는 사람마다 하루 수백 kcal씩 틀릴 수 있어요. 식사와 체중을 꾸준히 기록하면 <b>실제 체중 추세</b>로 내 진짜 소모량을 계산해 목표를 맞춰 드려요.</div>
    ${macroBar('제대로 기록한 날 (최근 4주)',n.days,10,'var(--acc)','일')}<div style="height:8px"></div>${macroBar('체중 기록 (2주 이상 기간)',Math.min(n.w,3),3,'var(--prot)','회')}
    ${n.partial?`<div class="muted" style="font-size:12px;margin-top:6px">목표의 절반도 안 기록된 날 ${n.partial}일은 빠진 기록으로 보고 계산에서 뺐어요.</div>`:''}`}
  else{const diff=a.est-a.base;h+=`<div class="kv"><div><b>${r0(a.intake).toLocaleString()}</b><span>평균 섭취 kcal</span></div><div><b>${a.slope>0?'+':''}${r1(a.slope*7)}kg</b><span>주당 추세 변화</span></div><div><b>${r0(a.est).toLocaleString()}</b><span>실제 소모 추정</span></div></div>
    <div class="note" style="margin-top:10px">최근 4주 기록으로 보면 실제 소모량이 공식(${r0(a.base).toLocaleString()}kcal)보다 <b>${Math.abs(r0(diff)).toLocaleString()}kcal ${diff>=0?'많아요':'적어요'}</b>. 신뢰도 ${r0(a.conf*100)}% (기록이 쌓일수록 올라가요).</div>
    ${a.need.partial?`<div class="muted" style="font-size:12px">빠진 기록으로 보이는 ${a.need.partial}일은 계산에서 뺐어요.</div>`:''}
    <div class="grid2" style="margin-top:10px"><button class="btn small" onclick="S.profile.adj=${a.factor};S.profile.adjAt=todayKey();save();render();toast('맞춤 보정을 적용했어요')">지금 적용 (×${a.factor})</button><button class="btn line small" onclick="S.profile.adj=1;save();render()">공식대로</button></div>`}
  h+=`<label class="row" style="margin-top:12px;font-size:13px;gap:8px"><input type="checkbox" style="width:auto" ${auto?'checked':''} onchange="S.profile.autoAdj=this.checked;save()"> 일주일마다 자동으로 보정하기</label>`;
  return h+`</div>`}
function scoreCard(days,c){const sc=days.map(x=>x.dd?dayScore(x.dd,calc(x.dd)):null);const v=sc.filter(Boolean);if(!v.length)return'';
  const avgS=r0(v.reduce((a,x)=>a+x.score,0)/v.length);const g=scoreGrade(avgS);const show=range===7?sc:sc.slice(-14);
  return `<div class="card"><h2>⭐ 식단 점수 <small>평균 ${avgS}점 · ${g[0]}</small></h2><div style="display:flex;gap:4px;align-items:flex-end;height:70px">${show.map(x=>`<div style="flex:1;background:${x?scoreGrade(x.score)[1]:'var(--line)'};height:${x?Math.max(6,x.score*0.7):4}px;border-radius:4px 4px 0 0;opacity:${x?1:.5}"></div>`).join('')}</div>
   <div class="muted" style="font-size:12px;margin-top:6px">${range===7?'최근 7일':'최근 14일'} · 칼로리·단백질·나트륨·첨가당·식이섬유·음식 신호등을 합친 점수예요</div></div>`}
function insight(avg,c){const o=[];if(avg('prot')<c.prot*0.8)o.push(`단백질이 평균 ${r0(c.prot-avg('prot'))}g 부족해요 — 계란 2개(12g), 닭가슴살 1팩(23g), 두부 반 모(13g)로 채워 보세요.`);
  if(avg('na')>c.sodium)o.push(`나트륨이 평균 ${r0(avg('na')).toLocaleString()}mg — 국물을 반만 드시면 하루 500~1,000mg 줄어요.`);
  if(avg('asugar')>c.asugar)o.push(`첨가당이 평균 ${r0(avg('asugar'))}g이에요 (기준 ${c.asugar}g). 2025년 기준이 '열량의 10% 이내'로 강화됐어요 — 단 음료부터 바꾸는 게 가장 쉬워요.`);
  if(avg('fiber')<c.fiber*0.6&&avg('fiber')>0)o.push(`식이섬유가 적어요 — 채소 반찬·잡곡밥·과일 1개를 더해 보세요.`);
  return o.map(x=>`<div class="note" style="margin-top:10px">💡 ${x}</div>`).join('')}
function setupCanvas(cv){const dpr=devicePixelRatio||1;const w=cv.clientWidth,h=+cv.getAttribute('height');cv.width=w*dpr;cv.height=h*dpr;cv.style.height=h+'px';const g=cv.getContext('2d');g.scale(dpr,dpr);return{g,w,h}}
const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function drawWeight(){const cv=$('#wc');if(!cv)return;const{g,w,h}=setupCanvas(cv);
  const from=new Date();from.setDate(from.getDate()-range+1);const fk=dkey(from);let ser=trendSeries().filter(x=>x.d>=fk);
  g.fillStyle=cssv('--sub');g.font='12px sans-serif';
  if(!ser.length){g.fillText('체중을 기록하면 그래프가 그려져요',10,h/2);return}
  const tw=S.profile.targetW;let vs=ser.flatMap(p=>p.raw!=null?[p.raw,p.t]:[p.t]);if(tw)vs.push(tw);let lo=Math.min(...vs)-0.8,hi=Math.max(...vs)+0.8;
  const L=34,R=10,T=10,B=22;const n=ser.length;const X=i=>L+(n===1?(w-L-R)/2:(w-L-R)*i/(n-1)),Y=v=>T+(h-T-B)*(1-(v-lo)/(hi-lo));
  g.strokeStyle=cssv('--line');g.lineWidth=1;for(let k=0;k<=3;k++){const v=lo+(hi-lo)*k/3;g.beginPath();g.moveTo(L,Y(v));g.lineTo(w-R,Y(v));g.stroke();g.fillText(r1(v),2,Y(v)+4)}
  if(tw&&tw>lo&&tw<hi){g.setLineDash([5,4]);g.strokeStyle=cssv('--acc');g.beginPath();g.moveTo(L,Y(tw));g.lineTo(w-R,Y(tw));g.stroke();g.setLineDash([]);g.fillStyle=cssv('--acc');g.fillText('목표',w-R-28,Y(tw)-4)}
  g.fillStyle=cssv('--sub');ser.forEach((p,i)=>{if(p.raw!=null){g.globalAlpha=.55;g.beginPath();g.arc(X(i),Y(p.raw),3,0,7);g.fill();g.globalAlpha=1}});
  if(n>1){g.strokeStyle=cssv('--prot');g.lineWidth=2.5;g.beginPath();ser.forEach((p,i)=>i?g.lineTo(X(i),Y(p.t)):g.moveTo(X(i),Y(p.t)));g.stroke()}
  g.fillStyle=cssv('--prot');g.beginPath();g.arc(X(n-1),Y(ser[n-1].t),4.5,0,7);g.fill();
  g.fillStyle=cssv('--sub');[0,n-1].forEach(i=>{const s=ser[i].d.slice(5).replace('-','/');g.fillText(s,Math.min(Math.max(X(i)-14,L),w-40),h-5)})}
function drawKcal(days,c){const cv=$('#kc');if(!cv)return;const{g,w,h}=setupCanvas(cv);const L=34,R=6,T=10,B=22;
  const hi=Math.max(c.target*1.3,...days.map(x=>x.t?.kcal||0))*1.05;const bw=(w-L-R)/days.length;const Y=v=>T+(h-T-B)*(1-v/hi);
  g.font='11px sans-serif';g.fillStyle=cssv('--sub');g.strokeStyle=cssv('--line');
  for(const v of[0,c.target]){g.beginPath();g.moveTo(L,Y(v));g.lineTo(w-R,Y(v));g.stroke();g.fillText(r0(v/100)/10+'k',2,Y(v)+4)}
  days.forEach((x,i)=>{const v=x.t?.kcal||0;if(v){const lim=c.target+(x.t.ex||0);g.fillStyle=v>lim+100?cssv('--bad'):cssv('--acc');const bx=L+i*bw+bw*0.18;const r=Math.min(4,bw*0.3);const bh=Y(0)-Y(v);
      g.beginPath();g.roundRect?g.roundRect(bx,Y(v),bw*0.64,bh,[r,r,0,0]):g.rect(bx,Y(v),bw*0.64,bh);g.fill()}
    if(range===7||i%Math.ceil(days.length/7)===0){g.fillStyle=cssv('--sub');g.fillText(range===7?WEEK[x.d.getDay()]:(x.d.getMonth()+1)+'/'+x.d.getDate(),L+i*bw+bw/2-(range===7?6:12),h-6)}});
  g.setLineDash([5,4]);g.strokeStyle=cssv('--acc');g.beginPath();g.moveTo(L,Y(c.target));g.lineTo(w-R,Y(c.target));g.stroke();g.setLineDash([])}

// ================= 내 정보 / 설정 =================
function renderMe(){const c=calc(),p=S.profile,s=S.settings;
  $('#main').innerHTML=`<div class="card"><h2>내 프로필 <button class="btn line small" onclick="editProfile()">수정</button></h2>
   <div class="kv"><div><b>${p.sex==='m'?'남':'여'} · ${c.age}세</b><span>성별·나이</span></div><div><b>${p.height}cm</b><span>키</span></div><div><b>${r1(c.w)}kg</b><span>현재 체중</span></div></div>
   <button class="btn ghost" style="width:100%;margin-top:10px" onclick="showTargets()">🎯 내 목표 칼로리·영양 보기</button></div>
   <div class="card"><h2>🤖 AI 설정 <small>${hasKey()?'<span class="tag">연결됨</span>':'<span class="tag w">키 필요</span>'}</small></h2>
   <div class="field"><label>사용할 AI</label><div class="seg" id="prov">${[['gemini','Google Gemini (무료)'],['claude','Claude (유료 API)']].map(([v,t])=>`<button data-v="${v}" class="${s.provider===v?'on':''}">${t}</button>`).join('')}</div></div>
   <div id="provbox"></div></div>
   <div class="card"><h2>데이터</h2><div class="muted" style="line-height:1.6">모든 기록은 이 휴대폰 안에만 저장돼요. 꼭 <b>홈 화면 아이콘</b>으로 열어서 쓰시고, 가끔 백업 코드를 복사해 두세요. 사진·질문은 분석할 때만 AI로 전송돼요.</div>
   <div class="grid2" style="margin-top:10px"><button class="btn line small" onclick="backup()">백업 코드 복사</button><button class="btn line small" onclick="restore()">백업 붙여넣기</button></div>
   <button class="btn danger small" style="width:100%;margin-top:8px" onclick="resetAll()">모든 기록 지우기</button></div>
   <div class="muted" style="text-align:center;padding:8px 0 20px;line-height:1.6">사진 칼로리는 AI 추정치로 ±20% 정도 오차가 있을 수 있어요.<br>질환이 있거나 약을 드신다면 식단·영양제는 전문가와 상의하세요.</div>`;
  document.querySelectorAll('#prov button').forEach(b=>b.onclick=()=>{s.provider=b.dataset.v;save();renderMe()});
  const box=$('#provbox');
  if(s.provider==='gemini')box.innerHTML=`<div class="note"><b>무료 키 받는 법 (2분)</b><br>1. 휴대폰 브라우저에서 <b>aistudio.google.com</b> 접속 → 구글 로그인<br>2. 왼쪽 메뉴 <b>Get API key</b> → <b>API 키 만들기</b><br>3. 만들어진 키(AIza로 시작)를 복사해서 아래에 붙여넣기<br><span class="muted">무료 한도 안에서 하루 수십 장은 충분해요.</span></div>
    <div class="field"><label>Gemini API 키</label><input id="gk" type="password" value="${esc(s.geminiKey)}" placeholder="AIza..."></div>
    <details><summary class="muted">고급: 모델 이름</summary><div class="field"><input id="gm" value="${esc(s.geminiModel)}"></div><div class="muted">안 되면 자동으로 다른 모델(${GEMINI_FALLBACK.join(', ')})을 시도해요.</div></details>`;
  else box.innerHTML=`<div class="note"><b>Claude API 키</b><br>console.anthropic.com → API Keys에서 발급 (사용량만큼 과금). 사진 1장 분석에 대략 몇 원~십몇 원 수준이에요.</div>
    <div class="field"><label>Claude API 키</label><input id="ck2" type="password" value="${esc(s.claudeKey)}" placeholder="sk-ant-..."></div>
    <details><summary class="muted">고급: 모델 이름</summary><div class="field"><input id="cm" value="${esc(s.claudeModel)}"></div></details>`;
  box.insertAdjacentHTML('beforeend',`<div class="grid2" style="margin-top:10px"><button class="btn" onclick="saveKeys()">저장</button><button class="btn line" id="tbtn" onclick="testAI()">연결 테스트</button></div>${s.provider==='gemini'?'<button class="btn line small" style="width:100%;margin-top:8px" onclick="diagAI()">🔧 문제 진단 (모델별 응답 확인)</button>':''}<div id="tres"></div>`)}
function saveKeys(silent){const s=S.settings;const v=id=>$(id)?$(id).value.trim():null;
  if(s.provider==='gemini'){if(v('#gk')!==s.geminiKey)s.geminiOK=false;s.geminiKey=v('#gk')??s.geminiKey;s.geminiModel=v('#gm')||s.geminiModel}else{s.claudeKey=v('#ck2')??s.claudeKey;s.claudeModel=v('#cm')||s.claudeModel}
  save();if(!silent){toast('저장했어요');renderMe()}}
async function diagAI(){const s=S.settings;const r=$('#tres');if(!s.geminiKey)return toast('키를 먼저 입력해 주세요');r.innerHTML='<div class="note"><span class="spin"></span> 모델별로 확인 중…</div>';const out=[];
  try{const lr=await fetchT('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200',{headers:{'x-goog-api-key':s.geminiKey}},15000);const lj=await lr.json().catch(()=>({}));
    out.push('모델 목록: '+lr.status+(lj.models?' ('+lj.models.filter(x=>/flash/.test(x.name)).map(x=>x.name.replace('models/','')).slice(0,8).join(', ')+')':' '+(lj.error?.message||'')));}catch(e){out.push('모델 목록: '+(e.message==='TIMEOUT'?'시간초과':'연결실패 '+e.message))}
  for(const m of GEMINI_FALLBACK){const t=Date.now();try{const x=await fetchT('https://generativelanguage.googleapis.com/v1beta/models/'+m+':generateContent',{method:'POST',headers:{'content-type':'application/json','x-goog-api-key':s.geminiKey},body:JSON.stringify({contents:[{parts:[{text:'1+1=? 숫자만'}]}]})},20000);const j=await x.json().catch(()=>({}));
    out.push(m+': '+x.status+' '+((Date.now()-t)/1000).toFixed(1)+'초'+(j.error?.message?' '+j.error.message.slice(0,80):''));if(x.ok&&!s.geminiOK){s.geminiModel=m;s.geminiOK=true;save()}}catch(e){out.push(m+': '+(e.message==='TIMEOUT'?'20초 시간초과':'연결실패 '+e.message))}
    r.innerHTML=`<div class="note" style="font-size:12.5px;line-height:1.6">${out.map(esc).join('<br>')}</div>`}
  r.insertAdjacentHTML('beforeend','<div class="muted" style="font-size:12px">이 화면을 캡처해서 보내 주시면 원인을 찾을 수 있어요.</div>')}
async function testAI(){saveKeys(true);const b=$('#tbtn'),r=$('#tres');if(!hasKey())return toast('키를 먼저 입력해 주세요');b.disabled=true;b.innerHTML='<span class="spin"></span>';
  try{const j=await askAI('다음 JSON만 출력: {"ok":true,"msg":"연결 성공 인사 한 마디(한국어 15자 이내)"}');r.innerHTML=`<div class="note">✅ 연결 성공 — ${esc(j.msg||'')} <span class="muted">(${esc(S.settings.provider==='gemini'?S.settings.geminiModel:S.settings.claudeModel)})</span></div>`}
  catch(e){r.innerHTML=`<div class="note w">⚠️ ${esc(e.message)}${aiLog?`<div style="font-size:11.5px;opacity:.8;margin-top:4px">상세: ${esc(aiLog)}</div>`:''}</div>`}b.disabled=false;b.textContent='연결 테스트'}
function editProfile(){const el=sheet(`<h3>프로필 수정<button onclick="closeSheet()">✕</button></h3>${profileForm(S.profile)}<button class="btn" style="width:100%;margin-top:12px" id="pfs">저장</button>`);
  bindSeg(el);if(S.profile.goal!=='lose')$('#pf-pacebox').style.display='none';
  $('#pfs').onclick=()=>{const p=readProfile(el);if(!p)return;const oldW=curWeight();S.profile=p;if(Math.abs(p.weight-oldW)>0.05)addWeight(p.weight);save();closeSheet();render();showTargets()}}
async function backup(){const t=btoa(unescape(encodeURIComponent(JSON.stringify({...S,settings:{...S.settings,geminiKey:'',claudeKey:''}}))));
  try{await navigator.clipboard.writeText(t);toast('백업 코드를 복사했어요 (사진 제외) — 메모장 등에 붙여넣어 보관하세요')}catch(e){sheet(`<h3>백업 코드<button onclick="closeSheet()">✕</button></h3><textarea style="height:200px">${t}</textarea><div class="muted">전체 선택해서 복사해 두세요.</div>`)}}
function restore(){const el=sheet(`<h3>백업 붙여넣기<button onclick="closeSheet()">✕</button></h3><textarea id="rt" style="height:160px" placeholder="백업 코드를 붙여넣으세요"></textarea><div class="note w">지금 기록은 백업 내용으로 바뀌어요.</div><button class="btn" style="width:100%" id="rgo">복원</button>`);
  $('#rgo').onclick=()=>{try{const o=JSON.parse(decodeURIComponent(escape(atob($('#rt').value.trim()))));if(!o.profile)throw 0;const keep=S.settings;S=Object.assign(JSON.parse(JSON.stringify(DEF)),o);S.settings={...keep};save();closeSheet();render();toast('복원했어요')}catch(e){toast('백업 코드가 올바르지 않아요')}}}
async function resetAll(){if(!await askYes('정말 모든 기록을 지울까요? 되돌릴 수 없어요.','모두 지우기'))return;const keep=S.settings;S=JSON.parse(JSON.stringify(DEF));S.settings=keep;save();indexedDB.deleteDatabase('healthnote-photos');_db=null;tab='home';render()}

// 뒤로 가기·화면 회전
window.addEventListener('resize',()=>{if(tab==='report')renderReport()});
render();
</script>
